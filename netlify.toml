# Static single-page site + one serverless function (the "Ask my work" agent).
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Mutable grounding record — always revalidate so deploys don't leave the
# fallback agent answering from a week-old kb.js while HTML is fresh.
[[headers]]
  for = "/assets/kb.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/track.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Brand marks + OG image (content-addressed by deploy; safe to cache a week).
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/resume.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400"
